<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehedi's University Management System</title>
  <style>

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    }
    .navbar {

    .navbar .brand { font-weight: 700; font-size: 1.05rem; color: white; text-decoration: none; white-space: nowrap; }

    .navbar .nav-links { display: none; flex-direction: column; position: absolute; top: 5.6rem; right: 1.25rem; gap: 0.15rem; width: 180px; padding: 0.5rem; background: #4c1d95; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

    .navbar .nav-links a:hover, .navbar .nav-links a.active { background: rgba(255,255,255,0.2); color: white; }
    .navbar > div:last-child { position: absolute; top: 0.75rem; right: 1.25rem; width: auto; justify-content: flex-end; margin-left: 0 !important; }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.25rem; animation: pageEnter 0.45s ease-out both; }
    .navbar { animation: navEnter 0.35s ease-out both; }
    .container > * { animation: contentEnter 0.5s ease-out both; }
    .container > *:nth-child(2) { animation-delay: 0.12s; }
    .container > *:nth-child(3) { animation-delay: 0.24s; }

    .stats-grid > * { animation: contentEnter 0.45s ease-out both; }
    .stats-grid > *:nth-child(2) { animation-delay: 0.08s; }
    .stats-grid > *:nth-child(3) { animation-delay: 0.16s; }
    .stats-grid > *:nth-child(4) { animation-delay: 0.24s; }
    .stats-grid > *:nth-child(5) { animation-delay: 0.32s; }
    .stats-grid > *:nth-child(6) { animation-delay: 0.4s; }
    .stats-grid > *:nth-child(7) { animation-delay: 0.48s; }
    .stats-grid > *:nth-child(8) { animation-delay: 0.56s; }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes navEnter {

<body>
  <div id="umsLoading"><div class="box">Loading data…</div></div>
  <div id="configBanner" class="config-banner hidden">
    Open this file in a text editor and set <code>SCRIPT_URL</code> near the top of the script to your Google Apps Script Web App URL.
  </div>
  <div id="app"></div>

  <!-- AI Assistant Widget -->
  <div id="ai-widget-container">
    <div id="ai-chat-box">
      <div class="ai-chat-header">
        <span>🤖 Gemini AI Support</span>
        <button id="ai-chat-close" style="background:none; border:none; color:#fff; cursor:pointer; font-size:16px;">✕</button>
      </div>
      <div class="ai-chat-messages" id="ai-chat-messages">
        <div class="ai-msg ai-msg-assistant">Hello! How can I assist you with your university records today?</div>
      </div>
      <form class="ai-chat-input-area" id="ai-chat-form">
        <input type="text" id="ai-chat-input" placeholder="Ask a question..." required>
        <button type="submit">Send</button>
      </form>
    </div>
    <button id="ai-chat-button">🤖</button>
  </div>

<script>
/* ============================================================
   CONFIG – paste your Google Apps Script Web App URL here
   ============================================================ */
const UMS_CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw28hMp0TcRSnEEDCSlZ0Sj7XZzQvct6MP0tAbNoPJD94F8UppcR6YrR6k5skCLs6f3ug/exec",
  SHOW_LOADING: false
};

/* ============================================================
   FLASH
   ============================================================ */
const Flash = (() => {
  const KEY = "ums_flash";
  function push(message, category) {
    const messages = readRaw();
    messages.push([category || "info", message]);
    sessionStorage.setItem(KEY, JSON.stringify(messages));
  }
  function readRaw() {
    const raw = sessionStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : [];
  }
  function consume() {
    const messages = readRaw();
    sessionStorage.removeItem(KEY);
    return messages;
  }
  function render(containerEl) {
    if (!containerEl) return;
    const messages = consume();
    messages.forEach(([category, message]) => {
      const div = document.createElement("div");
      div.className = "flash flash-" + category;
      div.textContent = message;
      containerEl.appendChild(div);
      if (category === "success") {
        setTimeout(() => {
          div.remove();
        }, 3000);
      }
    });
  }
  return { push, consume, render };
})();

/* ============================================================
   DB – Google Sheets API
   ============================================================ */
const DB = (() => {
  const cache = {};

  function showLoading(on) {
    if (!UMS_CONFIG.SHOW_LOADING) return;
    const el = document.getElementById("umsLoading");
    if (el) el.style.display = on ? "flex" : "none";
  }

  async function api(action, payload = {}) {
    if (!UMS_CONFIG.SCRIPT_URL || UMS_CONFIG.SCRIPT_URL.indexOf("PASTE_YOUR") !== -1) {
      throw new Error("Please set SCRIPT_URL in this HTML file to your Google Apps Script Web App URL.");
    }
    showLoading(true);
    try {
      const body = JSON.stringify(Object.assign({ action }, payload));
      const res = await fetch(UMS_CONFIG.SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: body,
        redirect: "follow"
      });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch (e) {
        throw new Error("Invalid response from Google Sheets API. Check deployment (Anyone access).");
      }
      if (json && json.ok === false) throw new Error(json.error || "API error");
      return json;
    } finally {
      showLoading(false);
    }
  }

  function invalidate(table) { delete cache[table]; }

  async function getTable(table) {
    if (cache[table]) return cache[table].slice();
    const res = await api("list", { table });
    cache[table] = res.data || [];
    return cache[table].slice();
  }

  async function insert(table, row) {
    const res = await api("insert", { table, data: row });
    invalidate(table);
    return res.id;
  }

  async function update(table, id, patch) {
    await api("update", { table, id, data: patch });
    invalidate(table);
    return true;
  }

  async function remove(table, id) {
    await api("delete", { table, id });
    invalidate(table);
    return true;
  }

  async function removeWhere(table, field, value) {
    await api("deletewhere", { table, field, value });
    invalidate(table);
  }

  async function findOne(table, predicate) {
    const rows = await getTable(table);
    return rows.find(predicate) || null;
  }

  async function findAll(table, predicate) {
    const rows = await getTable(table);
    return predicate ? rows.filter(predicate) : rows;
  }

  async function count(table) {
    return (await getTable(table)).length;
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function dateTime() {
    return new Date().toISOString().replace("T", " ").slice(0, 19);
  }

  async function seedIfNeeded() {
  // Disabled because the deployed Apps Script does not support
  // the "seedadmin" action.
  return null;
}

  async function loginRemote(usernameOrEmail, password, loginType) {
    return api("login", { usernameOrEmail, password, loginType });
  }

  async function signupRemote(data) {
    return api("signup", { data });
  }

  return {
    getTable, insert, update, remove, removeWhere, findOne, findAll, count,
    today, dateTime, seedIfNeeded, loginRemote, signupRemote, api, invalidate
  };
})();

/* ============================================================
   AUTH
   ============================================================ */
const AUTH = (() => {
  const SESSION_KEY = "ums_session";

  function getSession() {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }
  function setSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }
  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }
  function isLoggedIn() { return !!getSession(); }
  function isAdmin() {
    const s = getSession();
    return !!s && s.role === "admin";
  }

  async function login(usernameOrEmail, password, loginType) {
    const res = await DB.loginRemote(usernameOrEmail, password, loginType || "administrative");
    if (res.ok && res.user) {
      setSession({
        user_id: res.user.id,
        username: res.user.username,
        email: res.user.email || usernameOrEmail,
        full_name: res.user.full_name || res.user.username,
        role: res.user.role,
        student_id: res.user.student_id,
        faculty_id: res.user.faculty_id,
        login_type: loginType || "administrative",
        entry_time: new Date().toLocaleString(),
        avatar_data: res.user.photo_url || null
      });
      return { ok: true, user: res.user };
    }
    return { ok: false, message: res.error || "Invalid credentials" };
  }

  async function signup({ role, full_name, email, password, confirm_password }) {
    role = (role || "student").trim().toLowerCase();
    email = (email || "").trim();
    full_name = (full_name || "").trim();
    if (!email || !password) return { ok: false, message: "Email and password are required." };
    if (password !== confirm_password) return { ok: false, message: "Passwords do not match." };
    if (password.length < 6) return { ok: false, message: "Password must be at least 6 characters." };
    try {
      const data = { role, email, full_name: full_name || email, password };
      const res = await DB.signupRemote(data);
      if (res.ok) return { ok: true, message: res.message || "Account created! Please login." };
      return { ok: false, message: res.error || "Signup failed" };
    } catch (e) {
      return { ok: false, message: e.message || "Signup failed" };
    }
  }

  function updateAvatar(avatarData) {
    const session = getSession();
    if (!session) return;
    session.avatar_data = avatarData;
    setSession(session);
  }

  function logout() { clearSession(); }

  function requireLogin() {
    const s = getSession();
    if (!s) {
      Flash.push("Please login first.", "danger");
      location.hash = "#login";
      throw new Error("redirect");
    }
    return s;
  }

  function requireAdmin() {
    const s = requireLogin();
    const isStudentView = s.login_type === "student";
    const canManage = !isStudentView && (s.role === "admin" || s.role === "faculty");
    if (!canManage) {
      Flash.push("Only administrators and faculty members can edit or delete data.", "danger");
      location.hash = "#dashboard";
      throw new Error("redirect");
    }
    return s;
  }

  return { getSession, setSession, isLoggedIn, isAdmin, login, signup, updateAvatar, logout, requireLogin, requireAdmin };
})();

const H = {
  dash(v) {
    if (v === undefined || v === null || v === "") return "—";
    // Avoid showing "[object Object]" for dates / plain objects from Sheets
    if (typeof v === "object") {
      if (Object.prototype.toString.call(v) === "[object Date]" && !isNaN(v.getTime())) {
        return v.toISOString().slice(0, 10);
      }
      if (typeof v.toString === "function") {
        const s = v.toString();
        if (s && s !== "[object Object]") return s;
      }
      try {
        if (v.year || v.month || v.day) {
          // Apps Script-style date object serialized oddly
          const y = v.year || v.getFullYear?.();
          const m = String((v.month || (v.getMonth?.() + 1) || 1)).padStart(2, "0");
          const d = String(v.day || v.getDate?.() || 1).padStart(2, "0");
          if (y) return y + "-" + m + "-" + d;
        }
      } catch (_) {}
      return "—";
    }
    const s = String(v);
    return s === "[object Object]" ? "—" : s;
  },
  esc(v) {
    const d = document.createElement("div");
    d.textContent = String(H.dash(v));
    return d.innerHTML;
  },
  money(v) { return Number(v || 0).toFixed(2); },
  badge(text, type) { return `<span class="badge badge-${type}">${H.esc(text)}</span>`; },
  fullName(r) { return `${r.first_name || ""} ${r.last_name || ""}`.trim() || "—"; },
  studentLabel(s) { return s.student_id ? `${s.student_id} – ${H.fullName(s)}` : "—"; },
  courseLabel(c) { return c.course_code ? `${c.course_code} – ${c.title || ""}` : "—"; },
  confirm(msg, fn) { if (window.confirm(msg)) fn(); }
};

function calcGrade(marks, max) {
  const pct = max > 0 ? (marks / max) * 100 : 0;
  if (pct >= 90) return "A+";
  if (pct >= 80) return "A";
  if (pct >= 70) return "B";
  if (pct >= 60) return "C";
  if (pct >= 50) return "D";
  return "F";
}

function generatedAvatar(name, email) {
  const label = (name || email || "User").trim().split(/\s+/).map(word => word[0]).join("").slice(0, 2).toUpperCase();
  let hash = 0;
  for (const character of (email || name || "user")) hash = ((hash << 5) - hash) + character.charCodeAt(0) | 0;
  const hue = Math.abs(hash) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="hsl(${hue},65%,55%)"/><text x="50" y="56" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="white">${label}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}

function profileAvatar(session) {

function compressImageFile(file, maxSize, quality) {
  maxSize = maxSize || 256;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) {
      reject(new Error("Please choose an image file (JPG, PNG, or WebP)."));
      return;
    }
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width;
      let h = img.height;
      if (!w || !h) {
        URL.revokeObjectURL(objectUrl);
        reject(new Error("Could not read that image."));
        return;
      }
      if (w > h) {
        if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
      } else if (h > maxSize) {
        w = Math.round(w * maxSize / h); h = maxSize;
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#241936";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(objectUrl);
      let dataUrl = canvas.toDataURL("image/jpeg", quality);
      let q = quality;
      while (dataUrl.length > 40000 && q > 0.4) {
        q -= 0.08;
        dataUrl = canvas.toDataURL("image/jpeg", q);
      }
      resolve(dataUrl);
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("Could not load that image."));
    };
    img.src = objectUrl;
  });
}

async function showAppShell(activeKey) {
  const session = AUTH.requireLogin();
  const app = document.getElementById("app");

  if (!app) {
    throw new Error("Missing #app element in HTML.");
  }

  // Clear the old page completely
  app.replaceChildren();

  // Add navigation safely
  const navHolder = document.createElement("div");
  navHolder.innerHTML = renderNavbar(activeKey, session).trim();

  while (navHolder.firstChild) {
    app.appendChild(navHolder.firstChild);
  }

  // Create the page container explicitly
  const main = document.createElement("main");
  main.className = "container";
  main.innerHTML = `
    <div id="flashArea"></div>
    <div id="pageContent"></div>
  `;

  app.appendChild(main);

  const flashArea = main.querySelector("#flashArea");
  const pageContent = main.querySelector("#pageContent");

  if (!pageContent) {
    throw new Error("Could not create #pageContent.");
  }

  // Faculty access message
  if (
    !isStudentSession(session) &&
    session.login_type === "faculty" &&
    session.role === "faculty"
  ) {
    const info = document.createElement("div");
    info.className = "flash flash-info session-access-info";
    info.innerHTML =
      "You are logged in as <strong>Faculty</strong>. You can add, edit and delete data.";

    flashArea.appendChild(info);

    setTimeout(() => {
      info.remove();
    }, 3000);
  }

  Flash.render(flashArea);

  // Clock
  if (window.umsClockInterval) {
    clearInterval(window.umsClockInterval);
  }

  window.umsClockInterval = setInterval(() => {
    const clock = document.getElementById("currentTime");

    if (clock) {
      clock.textContent = new Date().toLocaleTimeString();
    }
  }, 1000);

  // Logout
  const logoutLink = document.getElementById("logoutLink");

  if (logoutLink) {
    logoutLink.addEventListener("click", (event) => {
      event.preventDefault();

      const exitTime = DB.dateTime();
      AUTH.logout();

      if (window.umsClockInterval) {
        clearInterval(window.umsClockInterval);
      }

      Flash.push(`Logged out successfully. Exit time: ${exitTime}`, "success");

      location.hash = "login";
    });
  }

  // Profile link
  const profileLink = document.querySelector(".profile-picture");

  if (profileLink) {
    profileLink.addEventListener("click", (event) => {
      event.preventDefault();
      location.hash = "profile";
    });
  }

  // Mobile menu
  const menuToggle = document.getElementById("menuToggle");
  const menu = document.querySelector(".nav-links");

  if (menuToggle && menu) {
    menuToggle.addEventListener("click", () => {
      const isOpen = menu.classList.toggle("menu-open");

      menuToggle.setAttribute("aria-expanded", String(isOpen));
      menuToggle.textContent = isOpen ? "Close Menu" : "Menu";
    });
  }

  return session;
}

  const session = await showAppShell("myfees");
  if (!isStudentSession(session)) { location.hash = "#dashboard"; route(); return; }
  const student = await getCurrentStudent(session);
  if (!student) {
    document.getElementById("pageContent").innerHTML = `<h1 class="page-title">My Fees</h1><div class="flash flash-warning">Student profile not found.</div>`;
    return;
  }
  const isPaid = f => f.paid === true || f.paid === 1 || f.paid === "TRUE" || f.paid === "true" || f.status === "Paid";
  const allFees = await DB.getTable("fees");
  const myFees = allFees.filter(f => Number(f.student_id) === Number(student.id)).sort((a, b) => b.id - a.id);
  const pending = myFees.filter(f => !isPaid(f));
  const paid = myFees.filter(f => isPaid(f));
  const totalPending = pending.reduce((s, f) => s + Number(f.amount || 0), 0);
  const totalPaid = paid.reduce((s, f) => s + Number(f.amount || 0), 0);

  const rows = myFees.length
    ? `<table><thead><tr><th>ID</th><th>Type</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Paid Date</th></tr></thead><tbody>
       ${myFees.map(f => {
         const paidFlag = isPaid(f);
         return `<tr>
           <td>${f.id}</td>
           <td>${H.esc(f.fee_type || "—")}</td>
           <td>${H.money(f.amount)}</td>
           <td>${H.esc(f.due_date || "—")}</td>
           <td>${paidFlag ? H.badge("Paid", "success") : H.badge("Pending", "warning")}</td>
           <td>${H.esc(f.paid_date || "—")}</td>
         </tr>`;
       }).join("")}
       </tbody></table>`
    : `<p class="empty">No fee records found for you.</p>`;

  document.getElementById("pageContent").innerHTML = `
    <h1 class="page-title">My Fees & Payments</h1>
    <div class="stats-grid">
      <div class="stat-card"><div class="number">${pending.length}</div><div class="label">Pending</div></div>
      <div class="stat-card"><div class="number">${H.money(totalPending)}</div><div class="label">Amount Due</div></div>
      <div class="stat-card"><div class="number">${paid.length}</div><div class="label">Paid</div></div>
      <div class="stat-card"><div class="number">${H.money(totalPaid)}</div><div class="label">Total Paid</div></div>
    </div>
    <div class="card"><div class="card-header">Payment History (${myFees.length})</div>
    <div class="card-body table-wrap">${rows}</div></div>
    <p style="color:#9ca3af;font-size:0.85rem;margin-top:0.5rem;">Contact the accounts office to make payments. This page only shows your fee records.</p>`;
}

async function pageAccounts() {
  await showAppShell("accounts");
  const users = (await DB.getTable("users")).slice().sort((a, b) => b.id - a.id);
  const studentCount = users.filter(u => u.role === "student").length;
  const facultyCount = users.filter(u => u.role === "faculty").length;
  const adminCount = users.filter(u => u.role === "admin").length;

  const roleBadge = role => {
    const cls = role === "admin" ? "flash-info" : (role === "faculty" ? "flash-warning" : "flash-success");
    return `<span class="flash ${cls}" style="display:inline-block;padding:0.15rem 0.55rem;margin:0;">${H.esc((role || "").toUpperCase())}</span>`;
  };

  const formatCreated = (v) => {
    if (v === null || v === undefined || v === "") return "—";
    if (typeof v === "object") {
      try { return new Date(v).toISOString().slice(0, 10); } catch (_) { return "—"; }
    }
    const s = String(v);
    if (s === "[object Object]") return "—";
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    return s;
  };

  const rows = users.length
    ? `<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Student ID</th><th>Faculty ID</th><th>Created</th><th>Actions</th></tr></thead><tbody>
       ${users.map(u => `<tr>
         <td>${u.id}</td>
         <td>${H.esc(u.full_name || u.username)}</td>
         <td>${H.esc(u.email)}</td>
         <td>${roleBadge(u.role)}</td>
         <td>${H.esc(u.student_id || "—")}</td>
         <td>${H.esc(u.faculty_id || "—")}</td>
         <td>${H.esc(formatCreated(u.created_at))}</td>
         <td>${u.role === "admin" ? "—" : `<a href="#" class="btn btn-danger" data-del="${u.id}">Remove</a>`}</td>
       </tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">No accounts have signed up yet.</p>`;

  document.getElementById("pageContent").innerHTML = `

    <p style="color:#9ca3af;font-size:0.85rem;margin-bottom:1rem;">
      Every account that can currently sign in to this system, with the role and ID it logs in as.
    </p>
    <div class="stats-grid">
      <div class="stat-card"><div style="font-size:1.6rem;font-weight:700;">${studentCount}</div><div style="color:#9ca3af;font-size:0.85rem;">Student</div></div>
      <div class="stat-card"><div style="font-size:1.6rem;font-weight:700;">${facultyCount}</div><div style="color:#9ca3af;font-size:0.85rem;">Faculty</div></div>
      <div class="stat-card"><div style="font-size:1.6rem;font-weight:700;">${adminCount}</div><div style="color:#9ca3af;font-size:0.85rem;">Admin</div></div>
    </div>
    <div class="card"><div class="card-header">All Accounts (${users.length})</div>
    <div class="card-body table-wrap">${rows}</div></div>`;

  document.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      const id = parseInt(el.getAttribute("data-del"), 10);
      H.confirm("Remove this account? They will no longer be able to log in.", async () => {
        try {
          await DB.remove("users", id);
          Flash.push("Account removed.", "info");
        } catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });

    e.preventDefault();

          if (alloc) {
            const room = await DB.findOne("rooms", r => Number(r.id) === Number(alloc.room_id));
            if (room) await DB.update("rooms", room.id, { occupied: Math.max(0, Number(room.occupied) - 1) });
            await DB.removeWhere("allocations", "student_id", id);
          }
          Flash.push("Student deleted.", "info");
        } catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });
}

      last_name: f.last_name.value.trim(),
      email: f.email.value.trim() || null,
      phone: f.phone.value.trim() || null,

        // Create new entry

      const item = faculty.find(f => Number(f.id) === id);
      if (!item) return;

      // Populate Form Fields
      document.getElementById("edit_id").value = item.id;
      document.getElementById("field_faculty_id").value = item.faculty_id || "";
      document.getElementById("field_first_name").value = item.first_name || "";
      document.getElementById("field_last_name").value = item.last_name || "";
      document.getElementById("field_email").value = item.email || "";
      document.getElementById("field_phone").value = item.phone || "";
      document.getElementById("field_department").value = item.department || "";
      document.getElementById("field_designation").value = item.designation || "";

      // Update Form UI state
      document.getElementById("formHeader").textContent = "Edit Faculty Member";
      document.getElementById("saveBtn").textContent = "Update Faculty";
      document.getElementById("cancelBtn").classList.remove("hidden");
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  // Cancel Edit Mode Handler
  document.getElementById("cancelBtn").addEventListener("click", () => {
    route();
  });

  // Delete Handler
  document.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      
      const id = parseInt(el.getAttribute("data-del"), 10);
      H.confirm("Delete this faculty member?", async () => {
        try {
          await DB.remove("faculty", id);

          const courses = await DB.getTable("courses");
          for (const c of courses) {
            if (Number(c.faculty_id) === id) {
              await DB.update("courses", c.id, { faculty_id: null });
            }
          }
          Flash.push("Faculty member deleted.", "info");
        } catch (err) {
          Flash.push(err.message, "danger");
        }
        route();
      });
    });
  });
}

  const studentMap = new Map(students.map(s => [Number(s.id), s]));

  const roomOpts = rooms.filter(r => Number(r.occupied || 0) < Number(r.capacity || 0))
    .map(r => `<option value="${r.id}">Room ${H.esc(r.room_number)} (${H.esc(r.block || "Main")}) - Spot: ${r.occupied}/${r.capacity}</option>`).join("");

    ? `<table><thead><tr><th>ID</th><th>Room Number</th><th>Block</th><th>Capacity</th><th>Occupied</th><th>Status</th><th>Actions</th></tr></thead><tbody>
       ${rooms.map(r => {
         const occ = Number(r.occupied || 0);
         const cap = Number(r.capacity || 0);
         const isFull = occ >= cap;
         return `<tr>
           <td>${r.id}</td><td><strong>${H.esc(r.room_number)}</strong></td>
           <td>${H.esc(r.block)}</td><td>${cap}</td><td>${occ}</td>
           <td>${H.badge(isFull ? "Full" : "Available", isFull ? "danger" : "success")}</td>
           <td><a href="#" class="btn btn-danger" data-del-room="${r.id}">Delete</a></td></tr>`;
       }).join("")}
       </tbody></table>`

    ? `<table><thead><tr><th>ID</th><th>Room</th><th>Student</th><th>Allocate Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>
       ${allocations.map(a => {
         const r = roomMap.get(Number(a.room_id));
         const s = studentMap.get(Number(a.student_id));
         const isActive = a.status === "Active";
         return `<tr>
           <td>${a.id}</td><td>${H.esc(r ? `Room ${r.room_number} (${r.block || ""})` : a.room_id)}</td>
           <td>${H.esc(s ? H.studentLabel(s) : a.student_id)}</td>

       </tbody></table>`

  document.getElementById("pageContent").innerHTML = `

    <div class="card"><div class="card-header">Add Hostel Room</div><div class="card-body">
      <form id="addRoomForm"><div class="form-grid">
        <div class="form-group"><label>Room Number *</label><input name="room_number" required placeholder="101"></div>
        <div class="form-group"><label>Block / Building</label><input name="block" placeholder="Block A"></div>
        <div class="form-group"><label>Capacity *</label><input name="capacity" type="number" value="2" min="1" required></div>
      </div><button type="submit" class="btn btn-primary">Add Room</button></form>
    </div></div>

    <div class="card"><div class="card-header">Allocate Room to Student</div><div class="card-body">
      <form id="allocForm"><div class="form-grid">
        <div class="form-group"><label>Room *</label><select name="room_id" required><option value="">Select Room</option>${roomOpts}</select></div>
        <div class="form-group"><label>Student *</label><select name="student_id" required><option value="">Select Student</option>${studentOpts}</select></div>
      </div><button type="submit" class="btn btn-primary">Allocate Room</button></form>
    </div></div>

    <div class="card"><div class="card-header">Room List (${rooms.length})</div><div class="card-body table-wrap">${roomRows}</div></div>
    <div class="card"><div class="card-header">Room Allocations (${allocations.length})</div><div class="card-body table-wrap">${allocRows}</div></div>`;

  document.getElementById("addRoomForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { AUTH.requireAdmin(); } catch (err) { return; }
    const f = e.target;
    try {
      await DB.insert("rooms", {
        room_number: f.room_number.value.trim(), block: f.block.value.trim() || null,
        capacity: parseInt(f.capacity.value, 10) || 2, occupied: 0
      });
      Flash.push("Room added.", "success");
    } catch (err) { Flash.push(err.message, "danger"); }
    route();
  });

  document.getElementById("allocForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { AUTH.requireAdmin(); } catch (err) { return; }
    const f = e.target;
    const room_id = parseInt(f.room_id.value, 10);
    const student_id = parseInt(f.student_id.value, 10);
    const room = roomMap.get(room_id);

    if (await DB.findOne("allocations", a => Number(a.student_id) === student_id && a.status === "Active")) {
      Flash.push("Student already has an active room allocation.", "danger"); route(); return;
    }
    if (!room || Number(room.occupied || 0) >= Number(room.capacity)) {
      Flash.push("Selected room is full.", "danger"); route(); return;
    }

    try {
      await DB.insert("allocations", {
        room_id, student_id, allocate_date: DB.today(), status: "Active"
      });
      await DB.update("rooms", room_id, { occupied: Number(room.occupied || 0) + 1 });

        try {
          const alloc = await DB.findOne("allocations", a => Number(a.id) === id);
          if (alloc && alloc.status === "Active") {
            await DB.update("allocations", id, { status: "Vacated" });
            const room = roomMap.get(Number(alloc.room_id));
            if (room) {
              await DB.update("rooms", room.id, { occupied: Math.max(0, Number(room.occupied || 0) - 1) });
            }
            Flash.push("Room vacated.", "success");
          }
        } catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });

  document.querySelectorAll("[data-del-room]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      const id = parseInt(el.getAttribute("data-del-room"), 10);
      H.confirm("Delete room and its allocations?", async () => {
        try {
          await DB.remove("rooms", id);
          await DB.removeWhere("allocations", "room_id", id);
          Flash.push("Room deleted.", "info");

        route();
      });
    });
  });

  document.querySelectorAll("[data-del-alloc]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      const id = parseInt(el.getAttribute("data-del-alloc"), 10);
      H.confirm("Delete allocation record?", async () => {
        try { await DB.remove("allocations", id); Flash.push("Allocation deleted.", "info"); }
        catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });
}

async function pageProfile() {
  const session = await showAppShell("profile");
  const avatar = profileAvatar(session);

  document.getElementById("pageContent").innerHTML = `
    <h1 class="page-title">My Profile</h1>
    <div class="card"><div class="card-body">
      <div class="avatar-upload-wrap">
        <div class="profile-picture" style="width:96px;height:96px;font-size:1.8rem;flex:0 0 96px;">
          <img id="avatarPreview" src="${avatar}" alt="Avatar">
        </div>
        <div>
          <h2 style="font-size:1.3rem;color:#f9fafb;">${H.esc(session.full_name || session.username)}</h2>
          <p style="color:#9ca3af;font-size:0.9rem;">${H.esc(session.email)} (${H.esc((session.role || "").toUpperCase())})</p>
          <div class="avatar-actions">
            <label class="btn btn-primary" style="margin:0;">
              Choose photo
              <input type="file" id="avatarInput" accept="image/*" style="display:none;">
            </label>
            <button type="button" class="btn btn-ghost" id="removePhotoBtn">Remove photo</button>
          </div>
          <p id="photoHint" style="color:#9ca3af;font-size:0.78rem;margin-top:0.45rem;">JPG or PNG. Saved to your account so it stays after login.</p>
        </div>
      </div>
      <form id="profileForm"><div class="form-grid">
        <div class="form-group"><label>Full Name</label><input name="full_name" value="${H.esc(session.full_name || "")}"></div>
        <div class="form-group"><label>Email</label><input value="${H.esc(session.email || "")}" disabled readonly></div>
        <div class="form-group"><label>Role</label><input value="${H.esc((session.role || "").toUpperCase())}" disabled readonly></div>
      </div><button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Profile</button></form>
    </div></div>`;

  let pendingPhoto = null;
  let removePhoto = false;

  document.getElementById("avatarInput").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const hint = document.getElementById("photoHint");
    hint.textContent = "Preparing photo…";
    try {
      pendingPhoto = await compressImageFile(file, 256, 0.72);
      removePhoto = false;
      document.getElementById("avatarPreview").src = pendingPhoto;
      hint.textContent = "Photo ready. Click Save Profile to keep it.";
    } catch (err) {
      pendingPhoto = null;
      hint.textContent = err.message || "Could not read that image.";
    }
  });

  document.getElementById("removePhotoBtn").addEventListener("click", () => {
    pendingPhoto = null;
    removePhoto = true;
    document.getElementById("avatarPreview").src = generatedAvatar(session.full_name, session.email || session.username);
    document.getElementById("photoHint").textContent = "Photo will be removed when you save.";
    const input = document.getElementById("avatarInput");
    if (input) input.value = "";
  });

  document.getElementById("profileForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("saveProfileBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    const name = e.target.full_name.value.trim();
    try {
      const payload = { full_name: name || session.username };
      if (removePhoto) payload.remove_photo = true;
      if (pendingPhoto) payload.photo = pendingPhoto;

      const res = await DB.api("saveprofile", { id: session.user_id, data: payload });
      const photo = (res.user && res.user.photo_url) || (removePhoto ? null : (pendingPhoto || session.avatar_data));

      session.full_name = (res.user && res.user.full_name) || name || session.username;
      session.avatar_data = photo;
      session.photo_url = photo;
      AUTH.setSession(session);

      Flash.push(res.message || "Profile picture saved.", "success");
    } catch (err) {
      Flash.push(err.message || "Could not save profile picture.", "danger");
    }
    route();
  });
}

async function route() {
  const r = getRoute();
  try {
    switch (r) {
      case "login":      await pageLogin(); break;
      case "signup":     await pageSignup(); break;
      case "dashboard":  await pageDashboard(); break;
      case "myfees":     await pageMyFees(); break;
      case "myidcard":   await pageMyIdCard(); break;
      case "admitcard":  await pageAdmitCard(); break;
      case "accounts":   await pageAccounts(); break;
      case "idcards":    await pageIdCards(); break;
      case "students":   await pageStudents(); break;
      case "faculty":    await pageFaculty(); break;
      case "courses":    await pageCourses(); break;
      case "enrollment": await pageEnrollment(); break;
      case "fees":       await pageFees(); break;
      case "exams":      await pageExams(); break;
      case "library":    await pageLibrary(); break;
      case "hostel":     await pageHostel(); break;
      case "profile":    await pageProfile(); break;
      default:           await pageDashboard(); break;
    }
  } catch (err) {
    if (err.message !== "redirect") {
      console.error(err);
      Flash.push("Page routing error: " + err.message, "danger");
    }
  }
}

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", () => {
  if (!UMS_CONFIG.SCRIPT_URL || UMS_CONFIG.SCRIPT_URL.indexOf("PASTE_YOUR") !== -1) {
    const banner = document.getElementById("configBanner");
    if (banner) banner.classList.remove("hidden");
  }
  route();

  // AI Widget Interactivity
  const chatBtn = document.getElementById("ai-chat-button");
  const chatBox = document.getElementById("ai-chat-box");
  const chatClose = document.getElementById("ai-chat-close");
  const chatForm = document.getElementById("ai-chat-form");
  const chatInput = document.getElementById("ai-chat-input");
  const chatMsgs = document.getElementById("ai-chat-messages");

  if (chatBtn && chatBox && chatClose) {
    chatBtn.addEventListener("click", () => {
      chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";
    });
    chatClose.addEventListener("click", () => {
      chatBox.style.display = "none";
    });
  }

  if (chatForm) {
    chatForm.addEventListener("submit", async e => {
      e.preventDefault();
      const prompt = chatInput.value.trim();
      if (!prompt) return;

      const userMsg = document.createElement("div");
      userMsg.className = "ai-msg ai-msg-user";
      userMsg.textContent = prompt;
      chatMsgs.appendChild(userMsg);
      chatInput.value = "";
      chatMsgs.scrollTop = chatMsgs.scrollHeight;

      const aiMsg = document.createElement("div");
      aiMsg.className = "ai-msg ai-msg-assistant";
      aiMsg.textContent = "Thinking...";
      chatMsgs.appendChild(aiMsg);
      chatMsgs.scrollTop = chatMsgs.scrollHeight;

      try {
        const res = await DB.api("askai", { prompt });
        if (res.ok && res.reply) {
          aiMsg.textContent = res.reply;
        } else {
          aiMsg.textContent = res.error || "Sorry, I couldn't get an answer.";
        }
      } catch (err) {
        aiMsg.textContent = "Error: " + err.message;
      }
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
    });
  }
});
</script>
</body>
