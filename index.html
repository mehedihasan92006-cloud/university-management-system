<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehedi's University Management System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #160d24; color: #e5e7eb; line-height: 1.5; min-height: 100vh;
    }
    .navbar {
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%);
      color: white; padding: 0.75rem 1.25rem; display: flex; align-items: center;
      flex-direction: column; align-items: flex-start; gap: 0.55rem; padding-bottom: 3.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100;
    }
    .navbar .brand { font-weight: 700; font-size: 1.05rem; color: white; text-decoration: none; white-space: nowrap; }
    .menu-toggle { display: inline-flex; align-items: center; justify-content: center; position: absolute; top: 3.1rem; right: 1.25rem; padding: 0.4rem 0.8rem; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; background: rgba(255,255,255,0.12); color: white; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .navbar .nav-links { display: none; flex-direction: column; position: absolute; top: 5.6rem; right: 1.25rem; gap: 0.15rem; width: 180px; padding: 0.5rem; background: #4c1d95; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .navbar .nav-links.menu-open { display: flex; }
    .navbar .nav-links a {
      color: rgba(255,255,255,0.85); text-decoration: none; padding: 0.35rem 0.65rem;
      border-radius: 6px; font-size: 0.85rem; font-weight: 500;
    }
    .navbar .nav-links a:hover, .navbar .nav-links a.active { background: rgba(255,255,255,0.2); color: white; }
    .navbar > div:last-child { position: absolute; top: 0.75rem; right: 1.25rem; width: auto; justify-content: flex-end; margin-left: 0 !important; }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.25rem; animation: pageEnter 0.45s ease-out both; }
    .navbar { animation: navEnter 0.35s ease-out both; }
    .container > * { animation: contentEnter 0.5s ease-out both; }
    .container > *:nth-child(2) { animation-delay: 0.12s; }
    .container > *:nth-child(3) { animation-delay: 0.24s; }
    .container > *:nth-child(4) { animation-delay: 0.36s; }
    .stats-grid > * { animation: contentEnter 0.45s ease-out both; }
    .stats-grid > *:nth-child(2) { animation-delay: 0.08s; }
    .stats-grid > *:nth-child(3) { animation-delay: 0.16s; }
    .stats-grid > *:nth-child(4) { animation-delay: 0.24s; }
    .stats-grid > *:nth-child(5) { animation-delay: 0.32s; }
    .stats-grid > *:nth-child(6) { animation-delay: 0.4s; }
    .stats-grid > *:nth-child(7) { animation-delay: 0.48s; }
    .stats-grid > *:nth-child(8) { animation-delay: 0.56s; }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes navEnter {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes contentEnter {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-title { font-size: 1.6rem; color: #f9fafb; margin-bottom: 1.25rem; font-weight: 700; }
    .card {
      background: #241936; border: 1px solid #4c3a63; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      margin-bottom: 1.25rem; overflow: hidden;
    }
    .card-header {
      background: #302047; padding: 0.75rem 1.1rem; font-weight: 600; color: #f3f4f6;
      border-bottom: 1px solid #4c3a63; font-size: 0.95rem;
    }
    .card-body { padding: 1.1rem; }
    .form-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.9rem; margin-bottom: 1rem;
    }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #d1d5db; margin-bottom: 0.3rem; }
    .form-group input, .form-group select {

    }

    }
    .btn-primary { background: #7c3aed; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-danger { background: #e53e3e; }
    .btn-danger:hover { background: #c53030; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 0.55rem 0.7rem; text-align: left; border-bottom: 1px solid #374151; }
    th { background: #111827; font-weight: 600; color: #d1d5db; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; }
    tr:hover td { background: #302047; }

    /* Auth pages */
    .auth-wrap {

    .auth-box .subtitle { text-align: center; color: #d1d5db; margin-bottom: 2rem; font-size: 1rem; }
    .auth-box .form-group { margin-bottom: 1rem; }
    .auth-box .form-group label { color: #e5e7eb; }

    .login-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-bottom: 1.5rem; }
    .login-type { padding: 0.55rem 0.35rem; border: 1px solid #5b4674; border-radius: 6px; background: #160d24; color: #d1d5db; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .login-type.active, .login-type:hover { background: #7c3aed; border-color: #a78bfa; color: white; }
    .auth-box .btn-full { width: 100%; padding: 0.7rem; font-size: 1rem; margin-top: 0.4rem; border-radius: 8px; }

    .session-times { display: flex; gap: 0.75rem; align-items: center; color: rgba(255,255,255,0.9); font-size: 0.75rem; white-space: nowrap; }
    .profile-picture { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex: 0 0 34px; border-radius: 50%; background: #a78bfa; color: #241936; font-size: 0.8rem; font-weight: 800; border: 2px solid rgba(255,255,255,0.8); text-decoration: none; overflow: hidden; }
    .profile-picture img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes welcomeIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes authBackgroundIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes titleIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes welcomeTextIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes loginContentIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes welcomeFlash {
      from { opacity: 0; transform: translateY(-12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .demo-hint { font-size: 0.78rem; color: #a0aec0; text-align: center; margin-top: 0.9rem; }
    @media (max-width: 600px) {
      .navbar { align-items: stretch; padding: 0.75rem 1rem; gap: 0.6rem; }
      .navbar .brand { text-align: center; white-space: normal; font-size: 0.95rem; }
      .menu-toggle { position: static; align-self: center; order: 2; }
      .navbar .nav-links { position: static; width: 100%; padding: 0; background: transparent; border: 0; box-shadow: none; align-items: stretch; order: 3; }
      .navbar .nav-links a { text-align: center; padding: 0.5rem 0.65rem; }
      .navbar > div:last-child {
        position: static; width: 100%; margin-left: 0 !important;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 0.4rem; order: 4;
      }
      .session-times { white-space: normal; flex-wrap: wrap; justify-content: center; }
      .auth-box { padding: 2.5rem 1rem; }
      .auth-box h1 { font-size: 1.15rem; }
      .login-types { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      table { font-size: 0.8rem; }
      th, td { padding: 0.45rem 0.5rem; }
      #ai-widget-container { right: 12px; bottom: 12px; }
      #ai-chat-box {
        position: fixed; left: 12px; right: 12px; bottom: 80px;
        width: auto; height: 65vh;
      }
    }
    .config-banner {
      background: #fef3c7; color: #92400e; padding: 0.75rem 1rem; text-align: center; font-size: 0.9rem;
      border-bottom: 1px solid #f59e0b;
    }
    .config-banner code { background: #fde68a; padding: 0.1rem 0.35rem; border-radius: 4px; }
    #umsLoading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.25);
      display: none; align-items: center; justify-content: center; z-index: 9999; color: #fff; pointer-events: none;
    }
    #umsLoading .box { background: #1e3a5f; padding: 1rem 1.5rem; border-radius: 8px; }
    .hidden { display: none !important; }

<body>
  <div id="umsLoading"><div class="box">Loading data…</div></div>
  <div id="configBanner" class="config-banner hidden">
    Open this file in a text editor and set <code>SCRIPT_URL</code> near the top of the script to your Google Apps Script Web App URL.
  </div>
  <div id="app"></div>

<script>
/* ============================================================
   CONFIG – paste your Google Apps Script Web App URL here
   ============================================================ */
const UMS_CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzR4NtEYIAjIgQvu8Uqpk0gawuTUkLQoBpKBi01zvxMOGBaXMBWvXFzI_n4K2djh8U1bw/exec",
  SHOW_LOADING: false
};

/* ============================================================
   FLASH
   ============================================================ */
const Flash = (() => {
  const KEY = "ums_flash";
  function push(message, category) {
    const messages = readRaw();
    messages.push([category || "info", message]);
    sessionStorage.setItem(KEY, JSON.stringify(messages));
  }
  function readRaw() {
    const raw = sessionStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : [];
  }
  function consume() {
    const messages = readRaw();
    sessionStorage.removeItem(KEY);
    return messages;
  }
  function render(containerEl) {
    const messages = consume();
    messages.forEach(([category, message]) => {
      const div = document.createElement("div");
      div.className = "flash flash-" + category;
      div.textContent = message;
      containerEl.appendChild(div);
      if (category === "success") {
        setTimeout(() => {
          div.remove();
        }, 3000);
      }
    });
  }
  return { push, consume, render };
})();

/* ============================================================
   DB – Google Sheets API
   ============================================================ */
const DB = (() => {
  const cache = {};

  function showLoading(on) {
    if (!UMS_CONFIG.SHOW_LOADING) return;
    const el = document.getElementById("umsLoading");
    if (el) el.style.display = on ? "flex" : "none";
  }

  async function api(action, payload = {}) {
    if (!UMS_CONFIG.SCRIPT_URL || UMS_CONFIG.SCRIPT_URL.indexOf("PASTE_YOUR") !== -1) {
      throw new Error("Please set SCRIPT_URL in this HTML file to your Google Apps Script Web App URL.");
    }
    showLoading(true);
    try {
      const body = JSON.stringify(Object.assign({ action }, payload));
      const res = await fetch(UMS_CONFIG.SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: body,
        redirect: "follow"
      });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch (e) {
        throw new Error("Invalid response from Google Sheets API. Check deployment (Anyone access).");
      }
      if (json && json.ok === false) throw new Error(json.error || "API error");
      return json;
    } finally {
      showLoading(false);
    }
  }

  function invalidate(table) { delete cache[table]; }

  async function getTable(table) {
    if (cache[table]) return cache[table].slice();
    const res = await api("list", { table });
    cache[table] = res.data || [];
    return cache[table].slice();
  }

  async function insert(table, row) {
    const res = await api("insert", { table, data: row });
    invalidate(table);
    return res.id;
  }

  async function update(table, id, patch) {
    await api("update", { table, id, data: patch });
    invalidate(table);
    return true;
  }

  async function remove(table, id) {
    await api("delete", { table, id });
    invalidate(table);
    return true;
  }

  async function removeWhere(table, field, value) {
    await api("deletewhere", { table, field, value });
    invalidate(table);
  }

  async function findOne(table, predicate) {
    const rows = await getTable(table);
    return rows.find(predicate) || null;
  }

  async function findAll(table, predicate) {
    const rows = await getTable(table);
    return predicate ? rows.filter(predicate) : rows;
  }

  async function count(table) {
    return (await getTable(table)).length;
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function dateTime() {
    return new Date().toISOString().replace("T", " ").slice(0, 19);
  }

  async function seedIfNeeded() {
    try { await api("seedadmin"); } catch (e) { console.warn("seedadmin:", e.message); }
  }

  async function loginRemote(usernameOrEmail, password, loginType) {
    return api("login", { usernameOrEmail, password, loginType });
  }

  async function signupRemote(data) {
    return api("signup", { data });
  }

  return {
    getTable, insert, update, remove, removeWhere, findOne, findAll, count,
    today, dateTime, seedIfNeeded, loginRemote, signupRemote, api, invalidate
  };
})();

/* ============================================================
   AUTH
   ============================================================ */
const AUTH = (() => {
  const SESSION_KEY = "ums_session";

  function getSession() {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }
  function setSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }
  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }
  function isLoggedIn() { return !!getSession(); }
  function isAdmin() {
    const s = getSession();
    return !!s && s.role === "admin";
  }

  async function login(usernameOrEmail, password, loginType) {
    const res = await DB.loginRemote(usernameOrEmail, password, loginType || "administrative");
    if (res.ok && res.user) {
      setSession({
        user_id: res.user.id,
        username: res.user.username,
        email: res.user.email || usernameOrEmail,
        full_name: res.user.full_name || res.user.username,
        role: res.user.role,
        login_type: loginType || "administrative",
        entry_time: new Date().toLocaleString(),
        avatar_data: null
      });
      return { ok: true, user: res.user };
    }
    return { ok: false, message: res.error || "Invalid credentials" };
  }

  async function signup({ role, full_name, email, password, confirm_password }) {
    role = (role || "student").trim().toLowerCase();
    email = (email || "").trim();
    full_name = (full_name || "").trim();
    if (!email || !password) return { ok: false, message: "Email and password are required." };
    if (password !== confirm_password) return { ok: false, message: "Passwords do not match." };
    if (password.length < 6) return { ok: false, message: "Password must be at least 6 characters." };
    try {
      const data = { role, email, full_name: full_name || email, password };
      const res = await DB.signupRemote(data);
      if (res.ok) return { ok: true, message: res.message || "Account created! Please login." };
      return { ok: false, message: res.error || "Signup failed" };
    } catch (e) {
      return { ok: false, message: e.message || "Signup failed" };
    }
  }

  function updateAvatar(avatarData) {
    const session = getSession();
    if (!session) return;
    session.avatar_data = avatarData;
    setSession(session);
  }

  function logout() { clearSession(); }

  function requireLogin() {
    const s = getSession();
    if (!s) {
      Flash.push("Please login first.", "danger");
      location.hash = "#login";
      throw new Error("redirect");
    }
    return s;
  }

  function requireAdmin() {
    const s = requireLogin();
    const isStudentView = s.login_type === "student";
    const canManage = !isStudentView && (s.role === "admin" || s.role === "faculty");
    if (!canManage) {
      Flash.push("Only administrators and faculty members can edit or delete data.", "danger");
      location.hash = "#dashboard";
      throw new Error("redirect");
    }
    return s;
  }

  return { getSession, isLoggedIn, isAdmin, login, signup, updateAvatar, logout, requireLogin, requireAdmin };
})();

/* ============================================================
   HELPERS
   ============================================================ */
const H = {
  dash(v) { return v === undefined || v === null || v === "" ? "—" : v; },
  esc(v) {
    const d = document.createElement("div");
    d.textContent = String(H.dash(v));
    return d.innerHTML;
  },
  money(v) { return Number(v || 0).toFixed(2); },
  badge(text, type) { return `<span class="badge badge-${type}">${H.esc(text)}</span>`; },
  fullName(r) { return `${r.first_name || ""} ${r.last_name || ""}`.trim() || "—"; },
  studentLabel(s) { return s.student_id ? `${s.student_id} – ${H.fullName(s)}` : "—"; },
  courseLabel(c) { return c.course_code ? `${c.course_code} – ${c.title || ""}` : "—"; },
  confirm(msg, fn) { if (window.confirm(msg)) fn(); }
};

function calcGrade(marks, max) {
  const pct = max > 0 ? (marks / max) * 100 : 0;
  if (pct >= 90) return "A+";
  if (pct >= 80) return "A";
  if (pct >= 70) return "B";
  if (pct >= 60) return "C";
  if (pct >= 50) return "D";
  return "F";
}

function generatedAvatar(name, email) {
  const label = (name || email || "User").trim().split(/\s+/).map(word => word[0]).join("").slice(0, 2).toUpperCase();
  let hash = 0;
  for (const character of (email || name || "user")) hash = ((hash << 5) - hash) + character.charCodeAt(0) | 0;
  const hue = Math.abs(hash) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="hsl(${hue},65%,55%)"/><text x="50" y="56" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="white">${label}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}

function profileAvatar(session) {
  return session.avatar_data || generatedAvatar(session.full_name, session.email || session.username);
}

function timeGreeting() {
  const hour = new Date().getHours();
  if (hour < 12) return "Good morning";
  if (hour < 18) return "Good afternoon";
  return "Good evening";
}

function getRoute() {
  const h = (location.hash || "#login").replace("#", "").split("?")[0];
  return h || "login";
}

async function showAppShell(activeKey) {
  const session = AUTH.requireLogin();
  const app = document.getElementById("app");
  app.innerHTML = renderNavbar(activeKey, session) +
    `<div class="container"><div id="flashArea"></div><div id="pageContent"></div></div>`;
  if (session.login_type === "student" || session.role === "user") {
    const info = document.createElement("div");
    info.className = "flash flash-info session-access-info";
    info.innerHTML = 'You are viewing the system as a <strong>Student</strong>. You can view data, but cannot add, edit or delete.';
    document.getElementById("flashArea").appendChild(info);
  } else if (session.login_type === "faculty" || session.role === "faculty") {
    const info = document.createElement("div");
    info.className = "flash flash-info session-access-info";
    info.innerHTML = 'You are logged in as <strong>Faculty</strong>. You can add, edit and delete data.';
    document.getElementById("flashArea").appendChild(info);
  }
  const accessInfo = document.querySelector(".session-access-info");
  if (accessInfo) setTimeout(() => accessInfo.remove(), 3000);
  Flash.render(document.getElementById("flashArea"));
  if (window.umsClockInterval) clearInterval(window.umsClockInterval);
  window.umsClockInterval = setInterval(() => {
    const clock = document.getElementById("currentTime");
    if (clock) clock.textContent = "Time: " + new Date().toLocaleTimeString();
  }, 1000);
  document.getElementById("logoutLink").addEventListener("click", e => {
    e.preventDefault();
    const exitTime = DB.dateTime();
    AUTH.logout();
    if (window.umsClockInterval) clearInterval(window.umsClockInterval);
    Flash.push("Logged out successfully. Exit time: " + exitTime, "success");
    location.hash = "#login";
  });
  document.querySelector(".profile-picture").addEventListener("click", e => {
    e.preventDefault();
    location.hash = "#profile";
    route();
  });
  document.getElementById("menuToggle").addEventListener("click", () => {
    const menu = document.querySelector(".nav-links");
    const toggle = document.getElementById("menuToggle");
    const isOpen = menu.classList.toggle("menu-open");
    toggle.setAttribute("aria-expanded", String(isOpen));
    toggle.textContent = isOpen ? "✕ Close" : "☰ Menu";
  });
  return session;
}

      const id = parseInt(el.getAttribute("data-del-exam"), 10);
      H.confirm("Delete exam and results?", async () => {
        try {
          await DB.removeWhere("results", "exam_id", id);
          await DB.remove("exams", id);
          Flash.push("Exam deleted.", "info");
        } catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });
}

async function pageLibrary() {
  await showAppShell("library");
  const [students, books, issues] = await Promise.all([
    DB.getTable("students"), DB.getTable("books"), DB.getTable("issues")
  ]);
  books.sort((a, b) => b.id - a.id);
  issues.sort((a, b) => b.id - a.id);
  const available = books.filter(b => Number(b.available_copies) > 0);
  const studentOpts = students.map(s => `<option value="${s.id}">${H.esc(H.studentLabel(s))}</option>`).join("");
  const bookOpts = available.map(b =>
    `<option value="${b.id}">${H.esc(b.title)} – ${b.available_copies} left</option>`
  ).join("");

  const bookRows = books.length
    ? `<table><thead><tr><th>ID</th><th>ISBN</th><th>Title</th><th>Author</th><th>Category</th><th>Total</th><th>Available</th><th>Actions</th></tr></thead><tbody>
       ${books.map(b => `<tr>
         <td>${b.id}</td><td>${H.esc(b.isbn)}</td><td>${H.esc(b.title)}</td><td>${H.esc(b.author)}</td>
         <td>${H.esc(b.category)}</td><td>${H.esc(b.total_copies)}</td><td>${H.esc(b.available_copies)}</td>
         <td><a href="#" class="btn btn-danger" data-del-book="${b.id}">Delete</a></td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">No books yet.</p>`;

  const issueRows = issues.length
    ? `<table><thead><tr><th>ID</th><th>Book</th><th>Student</th><th>Issue</th><th>Due</th><th>Return</th><th>Status</th><th>Actions</th></tr></thead><tbody>
       ${issues.map(i => {
         const b = books.find(r => Number(r.id) === Number(i.book_id)) || {};
         const s = students.find(r => Number(r.id) === Number(i.student_id)) || {};
         const active = (i.status || "Issued") !== "Returned";
         return `<tr><td>${i.id}</td><td>${H.esc(b.title)}</td><td>${H.esc(H.studentLabel(s))}</td>
           <td>${H.esc(i.issue_date)}</td><td>${H.esc(i.due_date)}</td><td>${H.esc(i.return_date)}</td>
           <td>${active ? H.badge("Issued", "warning") : H.badge("Returned", "success")}</td>
           <td>${active ? `<a href="#" class="btn btn-primary" data-return="${i.id}">Return</a>` : "—"}</td></tr>`;
       }).join("")}
       </tbody></table>`
    : `<p class="empty">No issues yet.</p>`;

  document.getElementById("pageContent").innerHTML = `
    <h1 class="page-title">Library</h1>
    <div class="card"><div class="card-header">Add Book</div><div class="card-body">
      <form id="addBookForm"><div class="form-grid">
        <div class="form-group"><label>ISBN</label><input name="isbn"></div>
        <div class="form-group"><label>Title *</label><input name="title" required></div>
        <div class="form-group"><label>Author</label><input name="author"></div>
        <div class="form-group"><label>Category</label><input name="category"></div>
        <div class="form-group"><label>Copies</label><input name="total_copies" type="number" value="1" min="1"></div>
      </div><button type="submit" class="btn btn-primary">Add Book</button></form>
    </div></div>
    <div class="card"><div class="card-header">Issue Book</div><div class="card-body">
      <form id="issueForm"><div class="form-grid">
        <div class="form-group"><label>Book *</label><select name="book_id" required><option value="">—</option>${bookOpts}</select></div>
        <div class="form-group"><label>Student *</label><select name="student_id" required><option value="">—</option>${studentOpts}</select></div>
        <div class="form-group"><label>Due Date</label><input name="due_date" type="date"></div>
      </div><button type="submit" class="btn btn-primary">Issue</button></form>
    </div></div>
    <div class="card"><div class="card-header">Books (${books.length})</div><div class="card-body table-wrap">${bookRows}</div></div>
    <div class="card"><div class="card-header">Issues (${issues.length})</div><div class="card-body table-wrap">${issueRows}</div></div>`;

  document.getElementById("addBookForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { AUTH.requireAdmin(); } catch (err) { return; }
    const f = e.target;
    const total = parseInt(f.total_copies.value || "1", 10);
    try {
      await DB.insert("books", {
        isbn: f.isbn.value.trim() || null, title: f.title.value.trim(),
        author: f.author.value.trim() || null, category: f.category.value.trim() || null,
        total_copies: total, available_copies: total
      });
      Flash.push("Book added.", "success");
    } catch (err) { Flash.push(err.message, "danger"); }
    route();
  });

  document.getElementById("issueForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { AUTH.requireAdmin(); } catch (err) { return; }
    const f = e.target;
    const book_id = parseInt(f.book_id.value, 10);
    const student_id = parseInt(f.student_id.value, 10);
    const book = await DB.findOne("books", r => Number(r.id) === book_id);
    if (!book || Number(book.available_copies) < 1) {
      Flash.push("Book not available.", "danger"); route(); return;
    }
    try {
      await DB.insert("issues", {
        book_id, student_id, issue_date: DB.today(),
        due_date: f.due_date.value || null, return_date: null, status: "Issued"
      });
      await DB.update("books", book_id, { available_copies: Number(book.available_copies) - 1 });
      Flash.push("Book issued.", "success");
    } catch (err) { Flash.push(err.message, "danger"); }
    route();
  });

  document.querySelectorAll("[data-return]").forEach(el => {
    el.addEventListener("click", async e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      const id = parseInt(el.getAttribute("data-return"), 10);
      try {
        const issue = await DB.findOne("issues", r => Number(r.id) === id);
        await DB.update("issues", id, { status: "Returned", return_date: DB.today() });
        const book = await DB.findOne("books", r => Number(r.id) === Number(issue.book_id));
        if (book) await DB.update("books", book.id, { available_copies: Number(book.available_copies) + 1 });
        Flash.push("Returned.", "success");
      } catch (err) { Flash.push(err.message, "danger"); }
      route();
    });
  });

  document.querySelectorAll("[data-del-book]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      const id = parseInt(el.getAttribute("data-del-book"), 10);
      H.confirm("Delete book?", async () => {
        try {
          await DB.remove("books", id);
          await DB.removeWhere("issues", "book_id", id);
          Flash.push("Deleted.", "info");
        } catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });
}

async function pageHostel() {
  await showAppShell("hostel");
  const [rooms, students, allocations] = await Promise.all([
    DB.getTable("rooms"), DB.getTable("students"), DB.getTable("allocations")
  ]);
  rooms.sort((a, b) => String(a.room_number).localeCompare(String(b.room_number)));
  allocations.sort((a, b) => b.id - a.id);
  const active = allocations.filter(a => (a.status || "Active") === "Active");
  const activeIds = new Set(active.map(a => Number(a.student_id)));
  const unallocated = students.filter(s => !activeIds.has(Number(s.id)));
  const availableRooms = rooms.filter(r => Number(r.occupied) < Number(r.capacity));
  const studentOpts = unallocated.map(s => `<option value="${s.id}">${H.esc(H.studentLabel(s))}</option>`).join("");
  const roomOpts = availableRooms.map(r =>
    `<option value="${r.id}">${H.esc(r.room_number)} (${r.occupied}/${r.capacity})</option>`
  ).join("");

  const roomRows = rooms.length
    ? `<table><thead><tr><th>ID</th><th>Room</th><th>Block</th><th>Capacity</th><th>Occupied</th><th>Actions</th></tr></thead><tbody>
       ${rooms.map(r => `<tr>
         <td>${r.id}</td><td>${H.esc(r.room_number)}</td><td>${H.esc(r.block)}</td>
         <td>${H.esc(r.capacity)}</td><td>${H.esc(r.occupied)}</td>
         <td><a href="#" class="btn btn-danger" data-del-room="${r.id}">Delete</a></td></tr>`).join("")}
       </tbody></table>`
    : `<p class="empty">No rooms yet.</p>`;

  const allocRows = allocations.length
    ? `<table><thead><tr><th>ID</th><th>Student</th><th>Room</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>
       ${allocations.map(a => {
         const s = students.find(r => Number(r.id) === Number(a.student_id)) || {};
         const room = rooms.find(r => Number(r.id) === Number(a.room_id)) || {};
         const act = (a.status || "Active") === "Active";
         return `<tr><td>${a.id}</td><td>${H.esc(H.studentLabel(s))}</td><td>${H.esc(room.room_number)}</td>
           <td>${H.esc(a.allocate_date)}</td>
           <td>${act ? H.badge("Active", "success") : H.badge(a.status || "—", "warning")}</td>
           <td>${act ? `<a href="#" class="btn btn-danger" data-vacate="${a.id}">Vacate</a>` : "—"}</td></tr>`;
       }).join("")}
       </tbody></table>`
    : `<p class="empty">No allocations yet.</p>`;

  document.getElementById("pageContent").innerHTML = `
    <h1 class="page-title">Hostel</h1>
    <div class="card"><div class="card-header">Add Room</div><div class="card-body">
      <form id="addRoomForm"><div class="form-grid">
        <div class="form-group"><label>Room Number *</label><input name="room_number" required placeholder="A-101"></div>
        <div class="form-group"><label>Block</label><input name="block"></div>
        <div class="form-group"><label>Capacity</label><input name="capacity" type="number" value="2" min="1"></div>
      </div><button type="submit" class="btn btn-primary">Add Room</button></form>
    </div></div>
    <div class="card"><div class="card-header">Allocate Room</div><div class="card-body">
      <form id="allocForm"><div class="form-grid">
        <div class="form-group"><label>Student *</label><select name="student_id" required><option value="">—</option>${studentOpts}</select></div>
        <div class="form-group"><label>Room *</label><select name="room_id" required><option value="">—</option>${roomOpts}</select></div>
      </div><button type="submit" class="btn btn-primary">Allocate</button></form>
    </div></div>
    <div class="card"><div class="card-header">Rooms (${rooms.length})</div><div class="card-body table-wrap">${roomRows}</div></div>
    <div class="card"><div class="card-header">Allocations (${allocations.length})</div><div class="card-body table-wrap">${allocRows}</div></div>`;

  document.getElementById("addRoomForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { AUTH.requireAdmin(); } catch (err) { return; }
    const f = e.target;
    const room_number = f.room_number.value.trim();
    if (await DB.findOne("rooms", r => r.room_number === room_number)) {
      Flash.push("Room already exists.", "danger"); route(); return;
    }
    try {
      await DB.insert("rooms", {
        room_number, block: f.block.value.trim() || null,
        capacity: parseInt(f.capacity.value || "2", 10), occupied: 0
      });
      Flash.push("Room added.", "success");
    } catch (err) { Flash.push(err.message, "danger"); }
    route();
  });

  document.getElementById("allocForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { AUTH.requireAdmin(); } catch (err) { return; }
    const f = e.target;
    const student_id = parseInt(f.student_id.value, 10);
    const room_id = parseInt(f.room_id.value, 10);
    const room = await DB.findOne("rooms", r => Number(r.id) === room_id);
    if (!room || Number(room.occupied) >= Number(room.capacity)) {
      Flash.push("Room full.", "danger"); route(); return;
    }
    try {
      await DB.insert("allocations", {
        room_id, student_id, allocate_date: DB.today(), status: "Active"
      });
      await DB.update("rooms", room_id, { occupied: Number(room.occupied) + 1 });
      Flash.push("Allocated.", "success");
    } catch (err) { Flash.push(err.message, "danger"); }
    route();
  });

  document.querySelectorAll("[data-vacate]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      const id = parseInt(el.getAttribute("data-vacate"), 10);
      H.confirm("Vacate this allocation?", async () => {
        try {
          const alloc = await DB.findOne("allocations", r => Number(r.id) === id);
          await DB.update("allocations", id, { status: "Vacated" });
          const room = await DB.findOne("rooms", r => Number(r.id) === Number(alloc.room_id));
          if (room) await DB.update("rooms", room.id, { occupied: Math.max(0, Number(room.occupied) - 1) });
          Flash.push("Vacated.", "info");
        } catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });

  document.querySelectorAll("[data-del-room]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      try { AUTH.requireAdmin(); } catch (err) { return; }
      const id = parseInt(el.getAttribute("data-del-room"), 10);
      H.confirm("Delete room?", async () => {
        try {
          await DB.remove("rooms", id);
          await DB.removeWhere("allocations", "room_id", id);
          Flash.push("Deleted.", "info");
        } catch (err) { Flash.push(err.message, "danger"); }
        route();
      });
    });
  });
}

        <div class="form-group"><label>Username</label><input value="${H.esc(session.username || "-")}" readonly></div>
        <div class="form-group"><label>Entry Time</label><input value="${H.esc(session.entry_time || "-")}" readonly></div>

      </div>
      <a class="btn btn-primary" href="#dashboard">Back to Dashboard</a>
    </div></div>`;

  }, 1000);
}

  login: pageLogin,
  signup: pageSignup,

  accounts: pageAccounts,
  idcards: pageIdCards,
  students: pageStudents,
  faculty: pageFaculty,
  courses: pageCourses,
  enrollment: pageEnrollment,
  fees: pageFees,
  exams: pageExams,
  library: pageLibrary,
  hostel: pageHostel
};

async function route() {
  const name = getRoute();
  const fn = PAGES[name] || pageLogin;
  try {
    await fn();
  } catch (e) {
    if (e.message !== "redirect") {
      console.error(e);
      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `<div class="container"><div class="flash flash-danger">${H.esc(e.message)}</div>
          <p><a href="#login">Back to login</a></p></div>`;
      }
    }
  }
}

window.addEventListener("hashchange", route);

function toggleAIChat() {
  const chatBox = document.getElementById("ai-chat-box");
  chatBox.style.display = (chatBox.style.display === "flex") ? "none" : "flex";
}

async function sendAIMessage() {
  const inputEl = document.getElementById("aiInput");
  const messagesContainer = document.getElementById("aiChatMessages");
  const prompt = inputEl.value.trim();

  if (!prompt) return;

  // Render User Message
  const userMsgDiv = document.createElement("div");
  userMsgDiv.className = "ai-msg ai-msg-user";
  userMsgDiv.textContent = prompt;
  messagesContainer.appendChild(userMsgDiv);
  inputEl.value = "";
  messagesContainer.scrollTop = messagesContainer.scrollHeight;

  // Placeholder Response Loading Indicator
  const botMsgDiv = document.createElement("div");
  botMsgDiv.className = "ai-msg ai-msg-assistant";
  botMsgDiv.textContent = "Thinking...";
  messagesContainer.appendChild(botMsgDiv);
  messagesContainer.scrollTop = messagesContainer.scrollHeight;

  try {
    const data = await DB.api("askai", { prompt: prompt });
    botMsgDiv.textContent = data.reply || "Error: Unable to process request.";
  } catch (err) {
    botMsgDiv.textContent = err.message || "Connection error. Check the Apps Script deployment.";
  }

  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

if (location.hash !== "#login") location.hash = "#login";
